# Do not deploy this file on server, it is only for local development

services:
  app-builder:
    build:
      context: ..
      dockerfile: infra/docker/dev.Dockerfile
    image: template-app-dev-image:latest

  app:
    container_name: template-app
    image: template-app-dev-image:latest
    command: uvicorn src.main.web:app --host 0.0.0.0 --port ${APP_BACKEND_PORT} --reload
    # Loopback-only: direct app access (bypassing Nginx) for local debugging.
    # Never bind backing services to 0.0.0.0 — Docker writes the DOCKER iptables
    # chain and would bypass UFW. See docs/readme/security.md.
    ports:
      - "127.0.0.1:${APP_BACKEND_PORT}:${APP_BACKEND_PORT}"
    volumes:
      - ..:/app
      - /app/.venv

  worker:
    image: template-app-dev-image:latest
    command: taskiq worker taskiq_worker.app:broker --receiver taskiq_worker.receiver:IdempotencyReceiver --max-async-tasks 20 --reload
    volumes:
      - ..:/app
      - /app/.venv

  scheduler:
    image: template-app-dev-image:latest
    volumes:
      - ..:/app
      - /app/.venv

  # Dev serves the production nginx config, so the proxy-dependent paths - the
  # forwarded headers TrustedProxy reads, the body limit, the WebSocket upgrade -
  # behave locally the way they will on a server. Only the published port differs.
  nginx:
    # !override replaces the published ports instead of appending to them: dev keeps
    # the stack off the privileged ports, where a locally running web server usually
    # already sits.
    ports: !override
      - "8000:80"

  # Postgres already publishes on 127.0.0.1 in the base file. Redis does not, so
  # re-expose it here on loopback for local debugging and host-side integration
  # tests (.env.test uses localhost). Loopback binds are not reachable from the
  # network, so the Docker/UFW iptables bypass does not apply.
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
