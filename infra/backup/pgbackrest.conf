# Bucket, endpoint, region, keys, cipher pass and the async queue limit come
# from PGBACKREST_* environment variables, never from this file.
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=host
repo1-retention-full-type=time
repo1-retention-full=14
repo1-cipher-type=aes-256-cbc
compress-type=zst
archive-async=y
# On the postgres-data volume (mounted at /var/lib/postgresql), so they survive a
# container recreate. The log holds the only record of a dropped WAL segment; the
# lock path is shared by postgres and the sidecar so a running backup and a
# deploy's check see each other.
spool-path=/var/lib/postgresql/pgbackrest/spool
log-path=/var/lib/postgresql/pgbackrest/log
lock-path=/var/lib/postgresql/pgbackrest/lock
log-level-file=warn
log-level-console=info
io-timeout=60
db-timeout=600
process-max=4
start-fast=y

[main]
pg1-path=/var/lib/postgresql/18/main
