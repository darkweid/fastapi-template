# Read at every server start through `-c config_file=` (infra/postgres/Dockerfile).
# pg_hba.conf and postgresql.auto.conf (ALTER SYSTEM) stay in the data directory,
# where the server finds them without being told.

# ---------------------------
# CORE
# ---------------------------
listen_addresses = '*'

# ---------------------------
# RESOURCE USAGE (MEMORY)
# ---------------------------
# The local default, sized for the 1G container limit in docker-compose.yml. A
# deploy overrides these, max_connections and max_wal_size with its resource
# profile (infra/resources/<profile>/postgres/sizing.conf, baked into the image
# and included at the end).
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 768MB

# ---------------------------
# WAL (WRITE-AHEAD LOG)
# ---------------------------
wal_buffers = -1
checkpoint_completion_target = 0.9
min_wal_size = 80MB
max_wal_size = 1GB

# ---------------------------
# QUERY PLANNER
# ---------------------------
random_page_cost = 1.2
effective_io_concurrency = 100
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000

# ---------------------------
# CONNECTIONS
# ---------------------------
max_connections = 100

# ---------------------------
# LOGGING
# ---------------------------
log_min_duration_statement = 1000
log_checkpoints = on
log_temp_files = 1MB

# ---------------------------
# AUTOVACUUM
# ---------------------------
autovacuum = on
autovacuum_naptime = 45s
autovacuum_vacuum_cost_delay = 2ms
autovacuum_max_workers = 5

# ---------------------------
# SSL
# ---------------------------
ssl = off

# ---------------------------
# LOCALE
# ---------------------------
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# ---------------------------
# OTHER
# ---------------------------
default_statistics_target = 100
timezone = 'UTC'
shared_preload_libraries = 'pg_stat_statements'

# PG Stats
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.save = on

# ---------------------------
# ARCHIVING
# ---------------------------
# Continuous WAL archiving to the pgBackRest repository (infra/backup). The
# command name must contain "pgbackrest": its `check` and `backup` refuse any
# other archive_command. archive_timeout closes a quiet segment after a minute,
# which bounds the data lost on a restore to the latest point.
archive_mode = on
archive_command = '/usr/local/bin/pgbackrest-archive-push %p'
archive_timeout = 60

# ---------------------------
# RESOURCE PROFILE
# ---------------------------
# Last on purpose: a later setting wins, so the sizing of the resource profile
# the image was built with (infra/resources/<profile>/postgres, copied here by
# infra/postgres/Dockerfile) overrides the values above. Built with no profile,
# the directory is empty and the base sizing holds.
include_dir '/etc/postgresql/conf.d'
