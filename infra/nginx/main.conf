# Loaded in the http context, so it covers every server, the default ones
# that drop unknown hosts included: their own error pages would otherwise
# carry the nginx version.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_headers_hash_max_size 512;
proxy_headers_hash_bucket_size 128;

# The one upstream both app.conf and tls.conf.example proxy to, declared here in
# the http context so the two servers cannot drift apart. Its servers come from
# app_upstream.inc: rendered at start from app_upstream.inc.template (the `app`
# service), and rewritten by infra/deploy/deploy.sh while it rolls the app, to
# name the exact containers that may take traffic. `resolve` looks the names up
# again through Docker's DNS every few seconds, so a container that restarts on
# a new address is followed without a reload.
upstream app_service_upstream {
    zone app_service_upstream 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    include /etc/nginx/app_upstream.inc;
    keepalive 256;
    # Shorter than gunicorn's --keep-alive (10s, infra/docker-compose.yml): an
    # idle connection is always closed by nginx first, never by the app while
    # nginx is writing a request on it, which nginx cannot retry for a POST.
    keepalive_timeout 5s;
}
