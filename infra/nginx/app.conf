upstream app_service_upstream {
    server app:8001;
    keepalive 256;
}

# Every request whose Host is not a name of the app server below lands here and
# is dropped without an answer (444): nothing reaches the app, and no redirect or
# page is ever built from a Host the operator did not configure. A request line
# nginx cannot parse is refused before the Host is read, by this server, so it
# carries the JSON error pages as well.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    include /etc/nginx/conf.d/error_pages.inc;

    location / {
        return 444;
    }
}

server {
    listen 80;
    # Requests for any other name are dropped by the default server above: add
    # the API's hostname here before deploying, and the server's address if
    # anything calls it by IP. localhost is what the dev stack is opened on.
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 20m;  # keep in sync with S3_MAX_UPLOAD_SIZE_BYTES (default 20MB)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    include /etc/nginx/conf.d/proxy.inc;
}
