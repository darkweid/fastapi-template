# This docker-compose file defines services for the FastAPI application stack
# It includes web application, database, cache, task queue, and monitoring services

name: fastapi-template
services:
  # APP_IMAGE lets a deploy run the image CI pushed to the registry instead of
  # building on the box (infra/deploy/deploy.sh, BUILD=0). Unset, every service
  # falls back to the locally built tag, so the plain `make run` path is unchanged.
  app-builder:
    container_name: template-app-builder
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    image: ${APP_IMAGE:-template-app-image:latest}
    networks:
      - app-network

  postgres:
    container_name: template-postgres
    build:
      context: ..
      dockerfile: infra/postgres/Dockerfile
    image: template-postgres:18
    restart: always
    shm_size: 256m
    # Loopback only: an operator reaches it through an SSH tunnel to 127.0.0.1 on
    # the host, the network never does (docs/readme/security.md). The host side is
    # its own variable: POSTGRES_PORT is what the app dials inside the network, and
    # the container always listens on 5432.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/18/main
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/postgresql.conf:/custom-config/postgresql.conf:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # No container_name and no published port: infra/deploy/deploy.sh rolls the
  # app by starting a second container of this service beside the serving one
  # (`up --scale app=2`), and a fixed name or host port would collide.
  app:
    image: ${APP_IMAGE:-template-app-image:latest}
    env_file: ../.env
    # SIGTERM makes gunicorn stop accepting and finish the requests in flight
    # within --graceful-timeout; stop_grace_period must stay longer, or docker
    # kills the requests the deploy lets drain. --keep-alive stays longer than
    # the upstream keepalive_timeout in infra/nginx/main.conf.
    command: gunicorn -k uvicorn_worker.UvicornWorker -w 4 -b 0.0.0.0:${APP_BACKEND_PORT} --worker-connections 1000 --keep-alive 10 --graceful-timeout 30 src.main.web:app
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      # /live/ touches no dependency: a Postgres or Redis outage must not make
      # docker restart an app container that is serving requests fine.
      test: ["CMD", "wget", "--spider", "http://0.0.0.0:${APP_BACKEND_PORT}/live/"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Probed every 2s while starting, so a deploy hands traffic to a new
      # container seconds after it boots instead of at the first 10s tick.
      start_period: 30s
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_healthy
      app-builder:
        condition: service_completed_successfully
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  worker:
    container_name: template-worker
    image: ${APP_IMAGE:-template-app-image:latest}
    env_file: ../.env
    # --max-async-tasks 20 is mirrored by tasks_engine pool_size+max_overflow
    # in src/core/database/engine.py - change both together.
    command: taskiq worker taskiq_worker.app:broker --receiver taskiq_worker.receiver:IdempotencyReceiver --max-async-tasks 20
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      # No HTTP surface here, so the check asserts what the worker actually
      # needs: the broker Redis is reachable from inside this container.
      test: ["CMD-SHELL", "python -c 'import asyncio; from redis.asyncio import Redis; from src.main.config import config; asyncio.run(Redis.from_url(config.redis.tasks_dsn).ping())'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-builder:
        condition: service_completed_successfully
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Exactly one scheduler instance: taskiq has no duplicate-fire protection,
  # N schedulers fire every cron N times.
  scheduler:
    container_name: template-scheduler
    image: ${APP_IMAGE:-template-app-image:latest}
    env_file: ../.env
    command: taskiq scheduler taskiq_worker.scheduler:scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import asyncio; from redis.asyncio import Redis; from src.main.config import config; asyncio.run(Redis.from_url(config.redis.tasks_dsn).ping())'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      app-builder:
        condition: service_completed_successfully
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nginx:
    container_name: template-nginx
    image: nginx:1.31.4
    restart: always
    volumes:
      # The directory, never its files one by one: `git checkout` on the box
      # replaces a changed file with a new inode, and a single-file bind mount
      # stays on the old one, so the deploy's reload would serve the previous
      # configuration while `nginx -t` passed the new one. nginx auto-loads
      # conf.d/*.conf (main.conf, app.conf); the *.inc files are included by
      # those, and the mount also hides the image's own default.conf, which
      # would otherwise serve the stock page to Host "localhost".
      - ./nginx:/etc/nginx/conf.d:ro
    # Writes the app upstream's servers before the image's own entrypoint runs
    # (infra/nginx/entrypoint.sh). Overriding the entrypoint drops the image's
    # command, so it is repeated here. The files it and infra/deploy/deploy.sh
    # write (app_upstream.inc, app_upstream.applied) sit in /etc/nginx itself,
    # the container's writable layer, outside the read-only conf.d mount.
    entrypoint: ["sh", "/etc/nginx/conf.d/entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      APP_BACKEND_PORT: ${APP_BACKEND_PORT}
    # 443 is published although app.conf serves plain http: TLS terminates here
    # once the host has a certificate (see nginx/tls.conf.example), and the host
    # firewall opens exactly these two ports.
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redis:
    container_name: template-redis
    image: 'redis:8.10'
    restart: unless-stopped
    # Loopback only, host port decoupled from REDIS_PORT, as for postgres above.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    # Not the app's env_file: that would hand Redis every secret of the stack.
    # redis-cli authenticates from REDISCLI_AUTH on its own, for the healthcheck
    # and `make redis-cli` alike, without the password in its argv.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      # Plain `redis-cli ping` exits 0 even on NOAUTH under requirepass, so a
      # broken instance reads as healthy; assert the PONG.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis.conf:/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  postgres-data:
    name: template-postgres-data
  redis-data:
    name: template-redis-data

networks:
  app-network:
    name: app-network
    driver: bridge
    # Pinned so the app can trust exactly its own proxy. Containers, one-off
    # `compose run` ones included, take addresses from ip_range only; the
    # gateway sits outside it, and Docker forwards published-port connections it
    # proxies (every IPv6 client among them) from the gateway. TRUST_PROXY_HOSTS
    # trusts ip_range and infra/nginx/proxy.inc denies the gateway on the
    # probes: change the three together. No static address for nginx:
    # `compose run nginx nginx -t` in deploy.sh would collide with the running
    # container's.
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          ip_range: 172.30.0.128/25
