# This docker-compose file defines services for the FastAPI application stack
# It includes web application, database, cache, task queue, and monitoring services

name: fastapi-template
services:
  app-builder:
    container_name: template-app-builder
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    image: template-app-image:latest
    networks:
      - app-network

  postgres:
    container_name: template-postgres
    build:
      context: ..
      dockerfile: infra/postgres/Dockerfile
    image: template-postgres:18
    restart: always
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/18/main
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/postgresql.conf:/custom-config/postgresql.conf:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  app:
    container_name: template-app
    image: template-app-image:latest
    env_file: ../.env
    command: gunicorn -k uvicorn_worker.UvicornWorker -w 4 -b 0.0.0.0:${APP_BACKEND_PORT} --worker-connections 1000 --keep-alive 10 src.main.web:app
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      # /live/ touches no dependency: a Postgres or Redis outage must not make
      # docker restart an app container that is serving requests fine.
      test: ["CMD", "wget", "--spider", "http://0.0.0.0:${APP_BACKEND_PORT}/live/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      app-builder:
        condition: service_completed_successfully
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  worker:
    container_name: template-worker
    image: template-app-image:latest
    env_file: ../.env
    # --max-async-tasks 20 is mirrored by tasks_engine pool_size+max_overflow
    # in src/core/database/engine.py - change both together.
    command: taskiq worker taskiq_worker.app:broker --receiver taskiq_worker.receiver:IdempotencyReceiver --max-async-tasks 20
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      # No HTTP surface here, so the check asserts what the worker actually
      # needs: the broker Redis is reachable from inside this container.
      test: ["CMD-SHELL", "python -c 'import asyncio; from redis.asyncio import Redis; from src.main.config import config; asyncio.run(Redis.from_url(config.redis.tasks_dsn).ping())'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-builder:
        condition: service_completed_successfully
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Exactly one scheduler instance: taskiq has no duplicate-fire protection,
  # N schedulers fire every cron N times.
  scheduler:
    container_name: template-scheduler
    image: template-app-image:latest
    env_file: ../.env
    command: taskiq scheduler taskiq_worker.scheduler:scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import asyncio; from redis.asyncio import Redis; from src.main.config import config; asyncio.run(Redis.from_url(config.redis.tasks_dsn).ping())'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      app-builder:
        condition: service_completed_successfully
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nginx:
    container_name: template-nginx
    image: nginx:1.29.7
    restart: always
    volumes:
      - ./nginx/main.conf:/etc/nginx/conf.d/00-main.conf:ro
      # Mounted over the image's own default.conf, which otherwise keeps serving
      # the stock nginx page to any request whose Host is literally "localhost".
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
    # 443 is published although app.conf serves plain http: TLS terminates here
    # once the host has a certificate (see nginx/tls.conf.example), and the host
    # firewall opens exactly these two ports.
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redis:
    container_name: template-redis
    image: 'redis:7.4'
    restart: unless-stopped
    env_file: ../.env
    healthcheck:
      # Plain `redis-cli ping` exits 0 even on NOAUTH under requirepass, so a
      # broken instance reads as healthy; authenticate and assert the PONG.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis.conf:/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  postgres-data:
    name: template-postgres-data
  redis-data:
    name: template-redis-data

networks:
  app-network:
    name: app-network
    driver: bridge
