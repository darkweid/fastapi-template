---
- name: Provision the application servers
  hosts: app_servers
  become: true
  force_handlers: true
  # bootstrap_port is set only during bootstrap, while sshd may still listen on
  # the provider's port.
  vars:
    ansible_port: "{{ bootstrap_port | default(sshd_port) }}"
  tasks:
    - name: Guard CI mode
      ansible.builtin.import_tasks: tasks/ci_guard.yml

    - name: Apply the baseline
      ansible.builtin.import_role:
        name: base

    - name: Manage the accounts
      ansible.builtin.import_role:
        name: users

    - name: Harden sshd
      ansible.builtin.import_role:
        name: sshd

    - name: Apply the SSH configuration now
      ansible.builtin.meta: flush_handlers

    - name: Connect on the configured SSH port from now on
      ansible.builtin.set_fact:
        ansible_port: "{{ sshd_port }}"

    # A fresh login against the configuration just reloaded: a drop-in that
    # passes sshd -t but shuts ops out fails the run here.
    - name: Drop the persistent connection
      ansible.builtin.meta: reset_connection

    - name: Log in again against the hardened sshd
      ansible.builtin.ping:

    - name: Install Docker
      ansible.builtin.import_role:
        name: docker
