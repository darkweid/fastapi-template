---
argument_specs:
  main:
    short_description: The ops and deploy accounts
    options:
      users_ops_authorized_keys:
        type: list
        elements: str
        required: true
        description: Public keys of the people who administer the server. Each one grants root.
      users_deploy_authorized_keys:
        type: list
        elements: str
        required: true
        description: Public key(s) CD logs in with.
      users_deploy_allowed_from:
        type: str
        default: ""
  ops:
    short_description: The ops account only, for bootstrap
    options:
      users_ops_authorized_keys:
        type: list
        elements: str
        required: true
  lock_bootstrap_user:
    short_description: Take SSH access away from the provider's account
    options:
      bootstrap_user:
        type: str
        required: true
      users_lock_bootstrap_user:
        type: bool
        default: true
