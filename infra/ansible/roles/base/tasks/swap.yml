---
- name: Read the active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: base_active_swap
  changed_when: false
  check_mode: false

- name: Add a swap file to a box with no swap
  when: base_active_swap.stdout | trim in ['', base_swap_file]
  block:
    - name: Allocate the swap file
      ansible.builtin.command: fallocate -l {{ base_swap_size_mb }}M {{ base_swap_file }}
      args:
        creates: "{{ base_swap_file }}"
      register: base_swap_allocated

    # Swap holds process memory; any local account could read a world-readable file.
    - name: Restrict the swap file to root
      ansible.builtin.file:
        path: "{{ base_swap_file }}"
        owner: root
        group: root
        mode: "0600"

    # Not a handler: swapon below needs the file formatted within this block.
    - name: Format the swap file  # noqa: no-handler
      ansible.builtin.command: mkswap {{ base_swap_file }}
      when: base_swap_allocated is changed
      changed_when: true

    - name: Turn the swap file on
      ansible.builtin.command: swapon {{ base_swap_file }}
      when: base_swap_file not in base_active_swap.stdout
      changed_when: true

    - name: Keep the swap file across reboots
      ansible.posix.mount:
        path: none
        src: "{{ base_swap_file }}"
        fstype: swap
        opts: sw
        state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/60-swappiness.conf
    state: present
