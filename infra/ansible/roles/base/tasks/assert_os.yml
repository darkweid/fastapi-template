---
- name: Refuse an unsupported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in base_supported_releases
    fail_msg: >-
      Supported: Ubuntu {{ base_supported_releases | join(', ') }}; this box runs
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    quiet: true
