---
- name: Install the SSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present

# Before ufw opens the port, so a refused one is not left exposed. A
# Docker-published port or any other daemon on sshd_port would take the
# connection the run moves to; a port sshd already holds is the move resuming.
- name: Read what listens on the SSH port
  ansible.builtin.command: ss -Hltnp "sport = :{{ sshd_port }}"
  register: sshd_port_listeners
  changed_when: false
  check_mode: false

# ss names systemd as the owner of every socket-activated listener, so systemd
# counts as sshd only where ssh.socket itself listens on the port.
- name: Read the ports ssh.socket listens on
  ansible.builtin.command: systemctl show --property=Listen --value ssh.socket  # noqa: command-instead-of-module
  register: sshd_socket_listen
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse a port another service holds
  ansible.builtin.assert:
    that:
      - >-
        sshd_port_listeners.stdout_lines
        | reject('search', '"sshd",pid=')
        | reject('search', '"systemd",pid=' if (':' ~ sshd_port ~ ' ') in sshd_socket_listen.stdout else '^$')
        | list == []
    fail_msg: >-
      Port {{ sshd_port }} is taken by another service
      ({{ sshd_port_listeners.stdout_lines | join('; ') }}). Pick another sshd_port.
    quiet: true

- name: Open the SSH port before sshd listens on it
  ansible.builtin.import_role:
    name: firewall
    tasks_from: ssh_rule

# sshd -t refuses to run without it, and it is gone after a reboot until the
# first connection on a socket-activated sshd.
- name: Create the privilege separation directory
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

# Read before the drop-in: force_handlers runs the restart even when a later
# task fails, and the restart needs this. A command, not systemd_service: the module fails on a server without ssh.socket.
- name: Read whether sshd is socket-activated
  ansible.builtin.command: systemctl is-enabled ssh.socket  # noqa: command-instead-of-module
  register: sshd_socket
  changed_when: false
  failed_when: false
  check_mode: false

- name: Write the hardening drop-in
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  register: sshd_dropin
  notify:
    - Reload systemd units for sshd
    - Restart sshd

# After the drop-in, so a drop-in that fails validation leaves sshd on the
# provider's port. OpenSSH adds up Port lines across files rather than keeping
# the first, so a provider's Port in sshd_config would stay open beside sshd_port.
- name: Leave the port to the drop-in
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^(Port\s.*)$'
    replace: '# \1  # set in sshd_config.d/00-hardening.conf'
  register: sshd_main_port
  notify:
    - Reload systemd units for sshd
    - Restart sshd

- name: Check the whole configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false

- name: Read the effective settings for ops
  ansible.builtin.command: /usr/sbin/sshd -T -C user=ops,host=localhost,addr=127.0.0.1
  register: sshd_effective_ops
  changed_when: false
  check_mode: false

- name: Read the effective settings for deploy
  ansible.builtin.command: /usr/sbin/sshd -T -C user=deploy,host=localhost,addr=127.0.0.1
  register: sshd_effective_deploy
  changed_when: false
  check_mode: false

# Equality, not presence: an extra Port or AllowUsers from another file must fail.
- name: Require exactly the declared settings
  ansible.builtin.assert:
    that:
      - >-
        sshd_effective_ops.stdout_lines | select('match', '^port ') | list
        == ['port ' ~ sshd_port] + ([] if sshd_previous_port | int == sshd_port | int else ['port ' ~ sshd_previous_port])
      - sshd_effective_ops.stdout_lines | select('match', '^allowusers ') | list == ['allowusers ops', 'allowusers deploy']
      - "'permitrootlogin no' in sshd_effective_ops.stdout_lines"
      - "'passwordauthentication no' in sshd_effective_ops.stdout_lines"
      - "'kbdinteractiveauthentication no' in sshd_effective_ops.stdout_lines"
      - "'pubkeyauthentication yes' in sshd_effective_ops.stdout_lines"
      - "'allowtcpforwarding yes' in sshd_effective_ops.stdout_lines"
      - "'allowtcpforwarding no' in sshd_effective_deploy.stdout_lines"
      - "'permittty no' in sshd_effective_deploy.stdout_lines"
    fail_msg: >-
      The effective sshd configuration differs from 00-hardening.conf: another file
      in /etc/ssh/sshd_config.d or sshd_config overrides or adds to it.
    quiet: true
  # A preview (--check) does not write the drop-in, so sshd still reports the old one.
  when: not (ansible_check_mode and (sshd_dropin is changed or sshd_main_port is changed))
