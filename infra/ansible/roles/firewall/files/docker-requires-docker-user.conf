# Installed by infra/ansible/roles/firewall.
# docker-user-firewall's WantedBy=docker.service is a weak dependency: Docker
# would start with an empty DOCKER-USER when the rules fail. Requires= would close
# that too, but would also restart Docker with every restart of the rules.
[Unit]
Wants=docker-user-firewall.service
After=docker-user-firewall.service

[Service]
ExecStartPre=/usr/bin/systemctl is-active --quiet docker-user-firewall.service
