---
- name: Read the DOCKER-USER chain
  ansible.builtin.command: iptables -S DOCKER-USER
  register: firewall_docker_user
  changed_when: false
  check_mode: false

- name: Read the DOCKER-USER unit
  ansible.builtin.systemd_service:
    name: docker-user-firewall
  register: firewall_docker_user_unit
  check_mode: false

# A Docker release that switches to its nftables backend has no DOCKER-USER; this
# fails the run instead of leaving published ports unfiltered.
- name: Require DOCKER-USER to end in DROP
  ansible.builtin.assert:
    that:
      - firewall_docker_user.stdout_lines | last == '-A DOCKER-USER -j DROP'
      - firewall_docker_user_unit.status.ActiveState == 'active'
    fail_msg: >-
      DOCKER-USER does not end in DROP or docker-user-firewall is not active:
      published container ports may be reachable from the internet.
    quiet: true
