# Relative paths here resolve against this file's directory. The make targets
# export ANSIBLE_CONFIG, since Ansible otherwise reads ansible.cfg from the
# working directory and make runs from the repository root.
[defaults]
collections_path = ./collections
roles_path = ./roles
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
# Accept a server's key on a first manual ssh, after comparing its fingerprint with
# the provider's console; never turn this off, every fork would inherit it.
host_key_checking = True

[connection]
pipelining = True
