# Baked into the postgres image (infra/postgres/Dockerfile) and included last by
# infra/postgres/postgresql.conf, so these win over its values.
# Sized for the 3 CPU / 5G postgres limits in ../compose.yml; change them together.

# ~25% of the container limit; effective_cache_size ~75% of it.
shared_buffers = 1280MB
effective_cache_size = 3840MB
maintenance_work_mem = 512MB
# Per sort or hash node, per connection: max_connections x work_mem is far past
# the limit, so raise it only for a few known heavy queries, never here.
work_mem = 16MB
max_wal_size = 2GB

# Two app containers during a roll x WEB_CONCURRENCY 6 x API pool 7
# (DB_POOL_SIZE 5 + DB_MAX_OVERFLOW 2) = 84, the worker's 2 processes x (tasks
# pool 20, DB_TASKS_POOL_SIZE 5 + DB_TASKS_MAX_OVERFLOW 15, + API pool 7) = 54,
# the scheduler's pools 27, a migration and an operator's psql: 167, plus
# headroom for a second psql or a one-off script.
max_connections = 180

# One parallel worker per CPU of the limit; a single query takes at most two of
# them, so a second one can run in parallel beside it.
max_worker_processes = 8
max_parallel_workers = 3
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
