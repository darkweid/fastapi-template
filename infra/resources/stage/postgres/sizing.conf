# Baked into the postgres image (infra/postgres/Dockerfile) and included last by
# infra/postgres/postgresql.conf, so these win over its values.
# Sized for the 1G postgres limit in ../compose.yml; change the two together.
# Everything but max_connections equals the base postgresql.conf.

# ~25% of the container limit; effective_cache_size ~75% of it.
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 128MB
# Per sort or hash node, per connection: max_connections x work_mem is far past
# the limit, so raise it only for a few known heavy queries, never here.
work_mem = 16MB
max_wal_size = 1GB

# Two app containers during a roll x WEB_CONCURRENCY 4 x API pool 7
# (DB_POOL_SIZE 5 + DB_MAX_OVERFLOW 2) = 56, the worker's 2 processes x (tasks
# pool 20, DB_TASKS_POOL_SIZE 5 + DB_TASKS_MAX_OVERFLOW 15, + API pool 7) = 54,
# the scheduler's pools 27, a migration and an operator's psql: 139, plus
# headroom for a second psql or a one-off script.
max_connections = 150

# No parallel-query settings: stage mirrors the base postgresql.conf on purpose,
# which leaves them at the server defaults.
