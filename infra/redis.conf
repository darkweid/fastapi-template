# command seconds changes
save 600 1
save 300 10
save 60 10000

# Snapshot file path
dbfilename dump.rdb
dir /data

# This instance backs the taskiq queue, so a crash between RDB snapshots would
# drop every queued task written since the last one. AOF caps that loss at ~1s
# of writes; `everysec` keeps the fsync cost off the cache and auth traffic
# sharing this instance.
appendonly yes
appendfsync everysec

# Cap well under the 1G container limit so an RDB/AOF-rewrite fork has headroom
# and cannot OOM-kill the instance. noeviction because this is a shared
# cache+queue: refuse writes rather than silently drop queued taskiq messages.
maxmemory 512mb
maxmemory-policy noeviction
