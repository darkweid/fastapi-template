# command seconds changes
save 600 1
save 300 10
save 60 10000

# Snapshot file path
dbfilename dump.rdb
dir /data

# This instance backs the taskiq queue, so a crash between RDB snapshots would
# drop every queued task written since the last one. AOF caps that loss at ~1s
# of writes; `everysec` keeps the fsync cost off the cache and auth traffic
# sharing this instance.
appendonly yes
appendfsync everysec

# A kill that lands mid-write leaves a malformed command in the AOF tail,
# and `aof-load-truncated` only covers a cleanly cut one: without this the
# instance refuses to start at all, taking the app and the worker with it.
# The tail is at most the last second of writes, which `everysec` already
# accepts losing. The value is a byte count; the unit suffixes other size
# options take are rejected here.
aof-load-corrupt-tail-max-size 65536

# Cap well under the 1G container limit so an RDB/AOF-rewrite fork has headroom
# and cannot OOM-kill the instance. noeviction because this is a shared
# cache+queue: refuse writes rather than silently drop queued taskiq messages.
maxmemory 512mb
maxmemory-policy noeviction
