[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: requires a live PostgreSQL (run via `make test-integration`)
# Integration tests are deselected by default so a bare `pytest`, `make test` and
# CI's unit job all stay runnable without Docker. `make test-integration` passes
# `-m integration`, and the later `-m` wins over the one coming from addopts.
addopts = -m "not integration"
