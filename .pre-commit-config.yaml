# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Use `pre-commit autoupdate` to update dependencies.
default_language_version:
  python: python3.13
repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [ "--py313-plus" ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-ast
      - id: debug-statements
      - id: check-merge-conflict
      - id: requirements-txt-fixer
        exclude: ^infra/requirements/.*\.txt$ # Exclude compiled reqs files
      - id: check-json

  - repo: local
    hooks:
      - id: sort-requirements-in
        name: sort requirements .in
        entry: python scripts/sort_requirements_in.py
        language: python
        files: ^infra/requirements/.*\.in$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args:
          - --fix

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/myint/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake
        # Import removal stays with ruff (F401), which honors noqa and __all__;
        # autoflake's --remove-all-unused-imports would silently strip re-exports
        # like the models/__init__.py imports Alembic autogenerate discovers.
        args: [ --remove-unused-variables ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [
          "--install-types",
          "--non-interactive",
          "--config-file=mypy.ini"
        ]
        exclude: ^(tests/|migrations/|scripts/)
        additional_dependencies:
          - aiosmtplib==5.1.2
          - fastapi==0.141.1
          - jinja2==3.1.6
          - pydantic==2.13.4
          - sqlalchemy==2.0.52
          - taskiq==0.12.4
          - taskiq-redis==1.2.3
          - PyJWT==2.13.0
          - sentry-sdk==2.67.1
          - pydantic-settings==2.15.0
          - redis==8.1.0
          - pytest==9.1.1
          - alembic==1.19.1
          - argon2-cffi==25.1.0
          - types-PyYAML==6.0.12.20260724
          - types-requests==2.33.0.20260712
          - types-ujson==5.10.0.20250822
