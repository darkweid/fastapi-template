# Staging CI: identical checks, a different branch, and a moving tag that never
# collides with the one production deploys from. The stage branch does not exist
# in the template - this workflow stays dormant until a fork creates it.
name: CI (stage)

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      push_image: ${{ github.event_name == 'push' }}
      moving_tag: stage
    # Not `secrets: inherit`: CI runs third-party actions on every push and pull
    # request, so it gets only the one secret _ci.yml actually declares.
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    # The ceiling for _ci.yml: a called workflow can never hold more than the
    # job that calls it, and this block - not the workflow-level one above -
    # is what that job holds. Coveralls comments on the pull request with the
    # token CI hands it, and only _ci.yml's unit-tests job takes the write.
    permissions:
      contents: read
      packages: write
      pull-requests: write
