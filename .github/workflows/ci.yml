name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            infra/requirements/base.txt
            infra/requirements/dev.txt
            infra/requirements/prod.txt
            infra/requirements.txt

      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('infra/requirements.txt', 'infra/requirements/dev.txt') }}

      - name: Create venv and install deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -r infra/requirements.txt

      - name: Create .env file from .env.example
        run: cp .env.example .env

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      - name: Run linter
        shell: bash
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          make lint

  migration-heads:
    name: Migration HEADs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            infra/requirements/base.txt
            infra/requirements/prod.txt

      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('infra/requirements/prod.txt') }}

      - name: Create venv and install deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -r infra/requirements/prod.txt

      - name: Create .env file from .env.example
        run: cp .env.example .env

      - name: Check migration HEADs
        shell: bash
        run: |
          export PYTHONPATH=$(pwd)
          echo "--- Alembic heads ---"
          ./.venv/bin/alembic heads
          HEADS_COUNT=$(.venv/bin/alembic heads | wc -l)
          if [ "$HEADS_COUNT" -gt 1 ]; then
            echo "ERROR: Multiple Alembic heads detected ($HEADS_COUNT)."
            exit 1
          else
            echo "OK: Only one Alembic head found."
          fi

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            infra/requirements/base.txt
            infra/requirements/dev.txt
            infra/requirements/prod.txt
            infra/requirements.txt

      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('infra/requirements.txt', 'infra/requirements/dev.txt') }}

      - name: Create venv and install deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -r infra/requirements.txt

      - name: Create .env file from .env.example
        run: cp .env.example .env

      - name: Run unit tests with coverage
        shell: bash
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          make test-cov

      - name: Upload coverage to Coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: cobertura
          file: coverage.xml

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Credentials, database name and port all mirror .env.test, which `TESTING=true`
    # loads and the suite reads its DSN from — a value changed in one place has to change
    # in the other. Locally the same suite runs against the throwaway container
    # `make test-integration` starts (infra/docker-compose.test.yml); here a service
    # container is simpler, because GitHub already health-gates it before the steps run.
    # Stock image, not infra/postgres/Dockerfile: the custom config it bakes in is not
    # what the suite tests. Keep the tag in step with that Dockerfile's base image.
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            infra/requirements/base.txt
            infra/requirements/dev.txt
            infra/requirements/prod.txt
            infra/requirements.txt

      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('infra/requirements.txt', 'infra/requirements/dev.txt') }}

      - name: Create venv and install deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -r infra/requirements.txt

      - name: Create .env file from .env.example
        run: cp .env.example .env

      # Migrations are not applied in a step of their own: the `migrated_database`
      # fixture does it, and that is the path developers run locally.
      - name: Run integration tests
        shell: bash
        env:
          TESTING: 'true'
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          pytest tests/integration -m integration -v

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: infra/requirements/security.txt

      - name: Install Bandit
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r infra/requirements/security.txt

      - name: Run Bandit
        shell: bash
        run: bandit -r src scripts migrations -q

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            infra/requirements/base.txt
            infra/requirements/dev.txt
            infra/requirements/prod.txt
            infra/requirements/security.txt

      - name: Install pip-audit
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r infra/requirements/security.txt

      - name: Audit pinned dependencies
        shell: bash
        run: |
          pip-audit \
            -r infra/requirements/base.txt \
            -r infra/requirements/dev.txt \
            -r infra/requirements/prod.txt

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action requires a license for repositories owned by an
          # organization; without it the action exits before scanning.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Builds the image once, here, so a broken Dockerfile fails in CI instead of
  # on the production box mid-deploy. CD then pulls this exact sha tag.
  build-and-push:
    name: Build & push image
    needs: [lint, migration-heads, unit-tests, integration-tests, bandit, pip-audit, gitleaks]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute image and tag
        id: meta
        run: |
          image_lower="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(echo "${{ github.sha }}" | cut -c1-12)"
          echo "image=${image_lower}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          # Lets a deploy assert which commit an image tag was actually built from.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
