name: CD

# Runs after CI succeeds on main, then deploys the image CI already built and
# pushed to GHCR - the box never builds on the CD path. workflow_dispatch adds
# a manual escape hatch for redeploying an already-built image - by its
# sha-<12> tag, the only shape CI ever produces - without waiting for a new
# push to main.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing sha-<12> image tag to redeploy (blank = sha-<12> of main HEAD)"
        required: false
        default: ""

env:
  # Deployment directory on the target server - adjust as needed for your environment
  APP_DIR: /root/app

jobs:
  deploy:
    name: Deploy
    # DEPLOY_ENABLED is a repository variable, not a secret: the `secrets`
    # context is unavailable in a job-level `if`. It is off by default so a
    # fresh fork - and this template itself - does not fail a deploy against
    # unset SSH secrets on every merge to main. Set it to `true` once the
    # server secrets below are filled in. A manual dispatch always carries
    # intent, so it skips the workflow_run conclusion/event/branch checks that
    # exist only to filter the automatic trigger down to "CI passed on main".
    if: >-
      ${{ vars.DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never cancelled and never parallel: two merges must not run two migrations
    # against the same database at once.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Capture job start time
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      # workflow_run carries the exact commit CI validated; workflow_dispatch has no
      # such context, so it provisionally checks out github.sha (the tip of the
      # dispatched ref, main by default). fetch-depth: 0 gives the next step full
      # history to resolve an older, explicitly pinned commit against, should the
      # dispatch ask for one.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # image_tag is dispatcher-controlled input, so it is read from `env:` here -
      # never interpolated into the script - and only a bare sha-<12 lowercase hex>
      # shape is accepted, since that is the only tag CI ever produces from a main
      # push. A matching tag is resolved against the full history fetched above and
      # checked out locally, so the runner's checkout, the image tag pushed to GHCR
      # and the remote box all agree on the exact same commit; a workflow_run keeps
      # deploying the commit CI itself validated, unchanged.
      - name: Resolve the commit to deploy
        id: ref
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_TAG" ]; then
              sha="${{ github.sha }}"
            else
              if ! printf '%s' "$INPUT_TAG" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
                echo "::error::image_tag '$INPUT_TAG' has an invalid shape."
                exit 1
              fi
              if ! printf '%s' "$INPUT_TAG" | grep -qE '^sha-[0-9a-f]{12}$'; then
                echo "::error::image_tag must be blank or match sha-<12 lowercase hex chars> - CI never produces any other shape. Got '$INPUT_TAG'."
                exit 1
              fi
              prefix="${INPUT_TAG#sha-}"
              if ! sha="$(git rev-parse --verify "${prefix}^{commit}" 2>/dev/null)"; then
                echo "::error::No commit in this repository's history matches image_tag prefix '$prefix'."
                exit 1
              fi
              git checkout --quiet "$sha"
            fi
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Compute image and tag
        id: meta
        run: |
          image_lower="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(echo "${{ steps.ref.outputs.sha }}" | cut -c1-12)"
          echo "image=${image_lower}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      # known_hosts comes from a secret (`ssh-keyscan <host>` once, by hand):
      # keyscanning inside the job would trust whatever answers, which is the
      # same hole as StrictHostKeyChecking=no.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy_key
          chmod 600 ~/.ssh/id_deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        id: deploy
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # shellcheck disable=SC2087  # the heredoc expands here on purpose: the
          # image tag and the secrets come from this runner, not from the server.
          ssh -i ~/.ssh/id_deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" bash -s <<EOF
          set -euo pipefail
          cd "${{ env.APP_DIR }}"
          git fetch --quiet origin
          git checkout --quiet ${{ steps.ref.outputs.sha }}
          echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
          # The token would otherwise sit base64-encoded in ~/.docker/config.json
          # on the box until the next deploy overwrites it.
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          BUILD=0 APP_IMAGE="${IMAGE}:${TAG}" bash infra/deploy/deploy.sh
          EOF

      # Send deployment status notification to Telegram
      - name: Telegram notification
        if: always()
        run: |
          # No `set -e` here: this step must still reach curl when an earlier
          # step failed, which is the case the alert exists for.
          sanitize_html() {
            echo "$1" \
              | sed 's/&/\&amp;/g' \
              | sed 's/</\&lt;/g' \
              | sed 's/>/\&gt;/g' \
              | sed 's/"/\&quot;/g' \
              | sed "s/'/\&#39;/g"
          }

          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            STATUS="✅ <b>SUCCESS</b>"
          else
            STATUS="❌ <b>FAILED</b>"
          fi

          END_TS=$(date +%s)
          DURATION=$((END_TS - ${JOB_START_TS:-END_TS}))

          if [ "$DURATION" -gt 60 ]; then
            DURATION_HUMAN="$((DURATION / 60)) min $((DURATION % 60)) sec"
          else
            DURATION_HUMAN="${DURATION} sec"
          fi

          COMMIT_MSG=$(git log -1 --pretty=format:'%s' 2>/dev/null || echo 'unknown')
          AUTHOR=$(git log -1 --pretty=format:'%an' 2>/dev/null || echo 'unknown')
          PROJECT=$(sanitize_html "${{ github.repository }}")
          PIPELINE_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MESSAGE="${STATUS}
          🚀 <b>Project</b>: ${PROJECT}
          🔖 <b>Version</b>: <code>${{ steps.ref.outputs.sha }}</code>
          👤 <b>Author</b>: ${AUTHOR}
          ⏱️ <b>Duration</b>: ${DURATION_HUMAN}
          ♻️ <b>Attempt</b>: ${GITHUB_RUN_ATTEMPT}
          🔗 <b>Pipeline</b>: <a href=\"${PIPELINE_URL}\">Open</a>
          📝 <b>Commit</b>: ${COMMIT_MSG}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.ALERT_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.ALERT_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
